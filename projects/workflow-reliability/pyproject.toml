[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-reliability"
version = "0.1.0"
description = "A dependency-free reference implementation for reliable workflow synchronization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Jiapeng Wang", url = "https://github.com/Wwwwwjp" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
workflow-reliability = "workflow_reliability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
