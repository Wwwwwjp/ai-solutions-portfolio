[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-growth-features"
version = "0.1.0"
description = "Point-in-time feature engineering for heterogeneous enterprise activity data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Jiapeng Wang" },
]
dependencies = [
  "pandas>=2.1,<3",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Wwwwwjp/ai-solutions-portfolio"
Repository = "https://github.com/Wwwwwjp/ai-solutions-portfolio"

[project.scripts]
enterprise-features = "enterprise_features.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enterprise_features = ["data/*.json"]
